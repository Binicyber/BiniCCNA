<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BINI Automation Credential Verification</title><style>body{margin:0;background:#071426;color:#eaf4ff;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:28px}.card{background:#0d2038;border:1px solid #245477;border-radius:18px;padding:24px;margin-top:20px}.logo{width:100px;height:100px;object-fit:cover;border-radius:18px;display:block;margin:auto}h1{text-align:center}input{box-sizing:border-box;width:100%;padding:14px;border-radius:10px;border:1px solid #456;background:#08182b;color:white;font-size:16px}button{margin-top:12px;padding:13px 18px;border:0;border-radius:10px;background:#168dd0;color:white;font-weight:700}.ok{border-left:5px solid #2fd18a}.warn{border-left:5px solid #f1bd45}.muted{color:#a9bfd3;font-size:13px}</style></head><body><main class="wrap"><img class="logo" src="https://raw.githubusercontent.com/Binicyber/logo/main/binilogo%20-%20Copy.jpeg" alt="BINI Automation"><h1>BINI Automation Credential Verification</h1><div class="card"><label for="id"><b>Credential ID</b></label><input id="id" placeholder="BA-NET-XXXXXXXX"><button onclick="verify()">Verify Credential</button></div><div id="out"></div><p class="muted">Independent BINI Automation technical training. This verification service does not represent Cisco certification.</p></main><script>const q=new URLSearchParams(location.search);if(q.get('id')){id.value=q.get('id');verify()}async function verify(){const v=id.value.trim().toUpperCase();if(!v){out.innerHTML='<div class="card warn">Enter a credential ID.</div>';return}try{const r=await fetch('./credentials.json?ts='+Date.now());const db=await r.json();const x=db.credentials.find(c=>c.id===v&&c.status==='valid');if(x)out.innerHTML='<div class="card ok"><h2>Verified ✓</h2><p><b>'+esc(x.name)+'</b></p><p>'+esc(x.program)+'</p><p>Score: '+esc(String(x.percentage))+'%<br>Issued: '+esc(x.issued_date)+'<br>Credential ID: '+esc(x.id)+'</p></div>';else out.innerHTML='<div class="card warn"><h2>Not found</h2><p>This credential is not currently present in the public BINI Automation registry.</p></div>'}catch(e){out.innerHTML='<div class="card warn">Verification registry is temporarily unavailable.</div>'}}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
